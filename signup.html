<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Hire Higher</title>

   <link rel="stylesheet" href="../css/style.css">
   <link rel="stylesheet" href="../css/theme.css">
   <script src="../javascript/theme.js" defer></script>
   <script src="../javascript/header.js" defer></script>
   <script src="../javascript/footer.js" defer></script>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../images/HireHigher.png">

</head>

<body>
    
    <div id="wrapper">
    <!-- Shared Header -->
    <div id="header-placeholder"></div>

    <main class="auth-page">

        <section class="auth-container">

            <div class="auth-header">
                <h1>Create Your Account</h1>
                <p>Start building your future with Hire Higher.</p>
            </div>

            <form class="auth-form" id="signup-form">

                <div class="form-group">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="firstName" placeholder="Enter your first name"
                        autocomplete="given-name" required>
                </div>

                <div class="form-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="lastName" placeholder="Enter your last name"
                        autocomplete="family-name" required>
                </div>

                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" name="email" placeholder="example@email.com"
                        autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" placeholder="Create a password"
                        minlength="8" autocomplete="new-password" required>
                    <small>Password must contain at least 8 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirmPassword"
                        placeholder="Re-enter your password" minlength="8" autocomplete="new-password" required>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" required>
                        I agree to the
                        <a href="../child-pages/privacy.html">
                            Terms and Privacy Policy
                        </a>
                    </label>
                </div>

                <button type="button" class="auth-button">
                    Create Account
                </button>

            </form>

            <div class="signin-prompt">
                <p>Already have an account?</p>
                <a href="../signin.html" class="auth-secondary-button">
                    Sign In
                </a>
            </div>

        </section>

    </main>

    <!-- Shared Footer -->
    <div id="footer-placeholder"></div>

</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../javascript/auth.js" defer></script>

</body>

</html>
