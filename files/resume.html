<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Higher - Resume Builder</title>
    <script src="/javascript/theme.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/x-icon" href="/images/HireHigher.png">
    <script src="/javascript/header.js" defer></script>
    <script src="/javascript/footer.js" defer></script>
    <script src="/javascript/resume.js" defer></script>
</head>
<body>
<div id="wrapper">
    <div id="header-placeholder"></div>
    <main>
        <div class="welcome"><h2>Build your resume</h2><p>Fill in the form and watch your resume update. Your work saves automatically in this browser.</p></div>
        <div class="tool">
            <form class="card" id="resumeForm" onsubmit="return false">
                <div class="field"><label for="name">Full name</label><input type="text" id="name" placeholder="Jordan Lee"></div>
                <div class="field"><label for="email">Email</label><input type="email" id="email" placeholder="jordan@example.com"></div>
                <div class="field"><label for="phone">Phone</label><input type="tel" id="phone" placeholder="555-123-4567"></div>
                <div class="field"><label for="summary">Summary</label><textarea id="summary" rows="3" placeholder="Reliable team player with two years of customer service experience."></textarea></div>
                <div class="field"><label for="skills">Skills</label><textarea id="skills" rows="2" placeholder="Communication, Excel, Teamwork"></textarea><p class="hint">Separate skills with commas.</p></div>
                <div class="field"><label for="experience">Experience</label><textarea id="experience" rows="5" placeholder="Cashier, Fresh Mart (2024-2025)&#10;Helped 100+ customers per shift"></textarea><p class="hint">Put each job or bullet on its own line.</p></div>
                <div class="field"><label for="education">Education</label><textarea id="education" rows="3" placeholder="Rexburg High School, Diploma, 2024"></textarea></div>
                <div class="controls">
                    <button type="button" class="btn" id="printBtn">Print or save as PDF</button>
                    <button type="button" class="btn alt" id="clearBtn">Clear form</button>
                </div>
            </form>
            <div id="preview" aria-live="polite"></div>
        </div>
    </main>
    <div id="footer-placeholder"></div>
</div>
</body>
</html>
