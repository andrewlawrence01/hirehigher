<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Resume</title>
    <script src="javascript/theme.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
    <script src="javascript/header.js" defer></script>
    <script src="javascript/footer.js" defer></script>

</head>

<body>
    <main>

        <div id="header-placeholder"></div>

        <h2>Resume Builder</h2>

        <p>
            Enter your information below to create your professional resume.
        </p>

        <form action="#" method="post">

            <fieldset>
                <legend>Personal Information</legend>

                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" name="full-name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone">

                <label for="location">Location</label>
                <input type="text" id="location" name="location">
            </fieldset>

            <fieldset>
                <legend>Professional Summary</legend>

                <label for="summary">Summary</label>
                <textarea id="summary" name="summary" rows="5"></textarea>
            </fieldset>

            <fieldset>
                <legend>Education</legend>

                <label for="school">School</label>
                <input type="text" id="school" name="school">

                <label for="degree">Degree or Program</label>
                <input type="text" id="degree" name="degree">

                <label for="graduation">Graduation Date</label>
                <input type="month" id="graduation" name="graduation">
            </fieldset>

            <fieldset>
                <legend>Work Experience</legend>

                <label for="job-title">Job Title</label>
                <input type="text" id="job-title" name="job-title">

                <label for="company">Company</label>
                <input type="text" id="company" name="company">

                <label for="work-dates">Dates Worked</label>
                <input type="text" id="work-dates" name="work-dates" placeholder="Example: January 2024 - Present">

                <label for="responsibilities">Responsibilities</label>
                <textarea id="responsibilities" name="responsibilities" rows="6"></textarea>
            </fieldset>

            <fieldset>
                <legend>Skills</legend>

                <label for="skills">Skills</label>
                <textarea id="skills" name="skills" rows="4"
                    placeholder="Example: HTML, CSS, JavaScript, Communication"></textarea>
            </fieldset>

            <button type="submit">Save Resume</button>
            <button type="reset">Clear Form</button>

        </form>
        <div id="footer-placeholder"></div>
    </main>
</body>

</html>
