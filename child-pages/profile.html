<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Higher - Profile</title>
    <script src="../javascript/theme.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/theme.css">
    <script src="../javascript/header.js" defer></script>
    <script src="../javascript/footer.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../images/HireHigher.png">
</head>

<body>

    <div id="wrapper">

        <div id="header-placeholder"></div>

        <main class="profile-page">
            <h1>Profile</h1>

            <form action="#" method="post">
                <label for="profile-name">Full Name</label>
                <input type="text" id="profile-name" name="name">

                <label for="profile-email">Email</label>
                <input type="email" id="profile-email" name="email">

                <label for="profile-location">Location</label>
                <input type="text" id="profile-location" name="location">

                <label for="profile-bio">About Me</label>
                <textarea id="profile-bio" name="bio" rows="5"></textarea>

                <button type="submit">Save Profile</button>
            </form>

            <p><a href="//index.html">Back to Home</a></p>
        </main>

        <div id="footer-placeholder"></div>
    </div>

</body>

</html>
