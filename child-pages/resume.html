<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Higher - Resume Builder</title>
    <script src="/javascript/theme.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" type="image/x-icon" href="/images/HireHigher.png">
    <script src="/javascript/header.js" defer></script>
    <script src="/javascript/footer.js" defer></script>
    <script src="/javascript/resume.js" defer></script>
</head>

<body>
    <div id="wrapper">
        <div id="header-placeholder"></div>
        <main>
            <div class="welcome">
                <h2>Build your resume</h2>
                <p>Fill in the form and watch your resume update. Your work saves automatically in this browser.</p>
            </div>
            <div class="tool">
                <form class="card" id="resumeForm" onsubmit="return false">

                    <div class="group">
                        <h3>About you</h3>
                        <div class="two-col">
                            <div class="field"><label for="name">Full name</label><input type="text" id="name"
                                    placeholder="Jordan Lee"></div>
                            <div class="field"><label for="email">Email</label><input type="email" id="email"
                                    placeholder="jordan@example.com"></div>
                            <div class="field"><label for="phone">Phone</label><input type="tel" id="phone"
                                    placeholder="555-123-4567"></div>
                            <div class="field"><label for="location">City, State</label><input type="text" id="location"
                                    placeholder="Rexburg, ID"></div>
                        </div>
                        <div class="field"><label for="link">Website or LinkedIn (optional)</label><input type="text"
                                id="link" placeholder="linkedin.com/in/jordanlee"></div>
                        <div class="field"><label for="summary">Summary</label><textarea id="summary" rows="3"
                                placeholder="Reliable team player with two years of customer service experience."></textarea>
                        </div>
                    </div>

                    <div class="group">
                        <h3>Skills</h3>
                        <div class="field"><label for="skills">Your skills</label><textarea id="skills" rows="2"
                                placeholder="Communication, Excel, Teamwork"></textarea>
                            <p class="hint">Separate skills with commas.</p>
                        </div>
                    </div>

                    <div class="group">
                        <h3>Experience</h3>
                        <div id="jobs"></div>
                        <button type="button" class="btn alt small" id="addJob">+ Add job</button>
                    </div>

                    <div class="group">
                        <h3>Education</h3>
                        <div id="schools"></div>
                        <button type="button" class="btn alt small" id="addSchool">+ Add school</button>
                    </div>

                    <div class="group">
                        <h3>Look</h3>
                        <div class="field">
                            <label for="accent">Accent color</label>
                            <select id="accent">
                                <option value="navy">Navy</option>
                                <option value="forest">Forest green</option>
                                <option value="plum">Plum</option>
                                <option value="rose">Rose</option>
                                <option value="slate">Charcoal</option>
                            </select>
                        </div>
                    </div>

                    <div class="controls">
                        <button type="button" class="btn" id="printBtn">Print or save as PDF</button>
                        <button type="button" class="btn alt" id="clearBtn">Clear form</button>
                    </div>
                    <p class="hint">In the print window, choose "Save as PDF" as the destination.</p>
                </form>
                <div id="preview" role="region" aria-label="Resume preview"></div>
            </div>
        </main>
        <div id="footer-placeholder"></div>
    </div>
</body>

</html>
