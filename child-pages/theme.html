<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Higher - Theme</title>
    <script src="../javascript/theme.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/theme.css">
    <script src="../javascript/header.js" defer></script>
    <script src="../javascript/footer.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../images/HireHigher.png">
</head>

<body>
    <div id="wrapper">
        <div id="header-placeholder"></div>

        <main>
            <h1>Choose Your Theme</h1>
            <form action="#" method="post">
                <fieldset>
                    <legend>Light Themes</legend>
                    <div class="theme-grid">
                        <label>
                            <input type="radio" name="theme" value="light">
                            Light Theme
                        </label>
                        <label>
                            <input type="radio" name="theme" value="sunset">
                            Sunset Theme
                        </label>
                        <label>
                            <input type="radio" name="theme" value="pink">
                            Molli Theme
                        </label>
                    </div>

                    <legend>Dark Themes</legend>
                    <div class="theme-grid">
                        <label>
                            <input type="radio" name="theme" value="dark">
                            Dark Theme
                        </label>
                        <label>
                            <input type="radio" name="theme" value="forest">
                            Forest Theme
                        </label>
                        <label>
                            <input type="radio" name="theme" value="grape">
                            Grape Theme
                        </label>
                        <label>
                            <input type="radio" name="theme" value="neon">
                            Neon Theme
                        </label>
                        <label>
                            <input type="radio" name="theme" value="red-black">
                            Red-Black Theme
                        </label>
                    </div>
                </fieldset>
                <button type="submit">Save Theme</button>
            </form>
        </main>
        <div id="footer-placeholder"></div>
    </div>
</body>

</html>
