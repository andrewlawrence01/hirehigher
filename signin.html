<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Hire Higher</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="{{root}}css/style.css">
    <link rel="stylesheet" href="{{root}}css/theme.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon"
          href="{{root}}images/HireHigher.png">

    <!-- JavaScript -->
    <script src="{{root}}javascript/theme.js" defer></script>
    <script src="{{root}}javascript/header.js" defer></script>
    <script src="{{root}}javascript/footer.js" defer></script>
</head>

<body>

    <div id="wrapper">
    <!-- Shared Header -->
    <div id="header-placeholder"></div>

    <main class="auth-page">

        <section class="auth-container">

            <div class="auth-header">
                <h1>Welcome Back!</h1>
                <p>Sign in to continue your career journey.</p>
            </div>

            <form class="auth-form" id="signin-form">

                <div class="form-group">
                    <label for="signin-email">Email Address</label>
                    <input
                        type="email"
                        id="signin-email"
                        name="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="signin-password">Password</label>
                    <input
                        type="password"
                        id="signin-password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>

                <div class="form-options">

                    <label class="checkbox-label">
                        <input type="checkbox" name="rememberMe">
                        Remember Me
                    </label>

                    <a href="#" class="forgot-password">
                        Forgot Password?
                    </a>

                </div>

                <button type="button" class="auth-button">
                    Sign In
                </button>

            </form>

            <div class="auth-divider">
                <span>New to Hire Higher?</span>
            </div>

            <p class="auth-switch">
                <a href="{{root}}signup.html" class="auth-secondary-button">
                    Create an Account
                </a>
            </p>

        </section>

    </main>

    <!-- Shared Footer -->
    <div id="footer-placeholder"></div>

</div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../javascript/auth.js" defer></script>

</body>
</html>
