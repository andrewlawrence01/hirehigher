<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Hire Higher</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="icon" type="image/x-icon"
          href="images/HireHigher.png">
    <script src="javascript/theme.js" defer></script>
    <script src="javascript/header.js" defer></script>
    <script src="javascript/footer.js" defer></script>
</head>

<body>

    <div id="wrapper">
    <!-- Shared Header -->
    <div id="header-placeholder"></div>

    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-header">
                <h1>Welcome to Hire Higher</h1>
                <p>Sign in to save your resume, practice interviews, and continue your career journey.</p>
            </div>

            <form class="auth-form" id="email-signin-form">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required>

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required>

                <button type="submit" class="btn auth-submit">
                    Sign in
                </button>
            </form>

            <div class="auth-divider">
                <span>or</span>
            </div>

            <button type="button" class="btn google-btn" onclick="signInWithGoogle()">
                Continue with Google
            </button>

            <p class="auth-note">
                Google securely handles your Google login. Hire Higher never sees your Google password.
            </p>

            <p class="auth-footer">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </p>
        </section>
    </main>

    <!-- Shared Footer -->
    <div id="footer-placeholder"></div>

</div>

</body>
</html>
