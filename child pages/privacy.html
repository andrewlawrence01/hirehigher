<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Higher - Privacy &amp; Security</title>
    <script src="/javascript/theme.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="icon" type="image/x-icon" href="/images/HireHigher.png">
    <script src="/javascript/header.js" defer></script>
    <script src="/javascript/footer.js" defer></script>

</head>

<body>

    <div id="header-placeholder"></div>

    <main>

        <section>
            <h2>Your Privacy</h2>
            <p>
                We value your privacy and work to protect your personal
                information.
            </p>
        </section>

        <section>
            <h2>Account Security</h2>

            <form action="#" method="post">

                <label for="current-password">Current Password</label>
                <input type="password" id="current-password" name="current-password">

                <label for="new-password">New Password</label>
                <input type="password" id="new-password" name="new-password">

                <label for="confirm-password">Confirm New Password</label>
                <input type="password" id="confirm-password" name="confirm-password">

                <button type="submit">Change Password</button>
            </form>
        </section>

        <section>
            <h2>Data &amp; Privacy</h2>

            <button type="button">Download My Data</button>
            <button type="button">Delete My Account</button>
        </section>

        <p><a href="/child pages/menu.html">Back to Menu</a></p>
        <p><a href="/index.html">Back to Home</a></p>

    </main>


    <div id="footer-placeholder"></div>
</body>

</html>
