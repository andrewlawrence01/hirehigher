<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Higher - Theme</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/x-icon" href="/images/HireHigher.png">
    <script src="/javascript/header.js" defer></script>
    <script src="/javascript/footer.js" defer></script>

</head>

<body>
    <div id="wrapper">
        <div id="header-placeholder"></div>

        <main>
            <form action="#" method="post">

                <fieldset>
                    <legend>Choose Your Theme</legend>

                    <label>
                        <input type="radio" name="theme" value="light" checked>
                        Light Theme
                    </label>

                    <label>
                        <input type="radio" name="theme" value="dark">
                        Dark Theme
                    </label>
                </fieldset>

                <button type="submit">Save Theme</button>
            </form>

            <p><a href="/child pages/menu.html">Back to Menu</a></p>
        </main>
        <div id="footer-placeholder"></div>
    </div>
</body>

</html>
