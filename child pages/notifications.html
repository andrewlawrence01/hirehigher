<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Higher - Notifications</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/x-icon" href="/images/HireHigher.png">
</head>
<body>

    <header>
        <h1>Notifications</h1>
    </header>

    <main>
        <form action="#" method="post">

            <fieldset>
                <legend>Notification Settings</legend>

                <label>
                    <input type="checkbox" name="job-alerts">
                    Job posting alerts
                </label>

                <label>
                    <input type="checkbox" name="interview-reminders">
                    Interview reminders
                </label>

                <label>
                    <input type="checkbox" name="resume-reminders">
                    Resume reminders
                </label>

                <label>
                    <input type="checkbox" name="email-notifications">
                    Email notifications
                </label>
            </fieldset>

            <button type="submit">Save Notification Settings</button>
        </form>

        <p><a href="/child pages/menu.html">Back to Menu</a></p>
        <p><a href="/index.html">Back to Home</a></p>
    </main>

</body>
</html>
