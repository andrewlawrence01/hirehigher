<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Higher - Preferences</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/x-icon" href="/images/HireHigher.png">
</head>
<body>

    <header>
        <h1>Preferences</h1>
    </header>

    <main>
        <form action="#" method="post">

            <fieldset>
                <legend>Job Preferences</legend>

                <label for="preferred-field">Preferred Job Field</label>
                <input type="text" id="preferred-field" name="preferred-field">

                <label for="preferred-location">Preferred Location</label>
                <input type="text" id="preferred-location" name="preferred-location">

                <label for="preferred-job-type">Preferred Job Type</label>
                <select id="preferred-job-type" name="preferred-job-type">
                    <option value="">Select a job type</option>
                    <option value="full-time">Full Time</option>
                    <option value="part-time">Part Time</option>
                    <option value="internship">Internship</option>
                    <option value="remote">Remote</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Interview Preferences</legend>

                <label>
                    <input type="checkbox" name="practice-behavioral">
                    Practice behavioral questions
                </label>

                <label>
                    <input type="checkbox" name="practice-technical">
                    Practice technical questions
                </label>
            </fieldset>

            <li><button type="submit">Save Preferences</button></li>
        </form>

        <li><p><a href="/child pages/menu.html">Back to Menu</a></p></li>
        <li><p><a href="/index.html">Back to Home</a></p></li>
    </main>

</body>
</html>
