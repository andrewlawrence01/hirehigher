<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Higher - Practice Interviews</title>
    <script src="/javascript/theme.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/x-icon" href="/images/HireHigher.png">
    <script src="/javascript/header.js" defer></script>
    <script src="/javascript/footer.js" defer></script>
    <script src="/javascript/interview.js" defer></script>
</head>
<body>
<div id="wrapper">
    <div id="header-placeholder"></div>
    <main>
        <div class="welcome"><h2>Practice interviews</h2><p>Pick a topic, answer out loud, and use the timer to keep each answer under two minutes.</p></div>
        <div class="tool">
            <div class="card">
                <div class="field"><label for="category">Question type</label>
                    <select id="category">
                        <option value="behavioral">Behavioral</option>
                        <option value="general">General</option>
                        <option value="strengths">Strengths and weaknesses</option>
                        <option value="closing">Closing questions</option>
                    </select>
                </div>
                <p class="question" id="question" aria-live="polite">Press "New question" to start.</p>
                <p class="hint" id="tip"></p>
                <div class="controls">
                    <button type="button" class="btn" id="newBtn">New question</button>
                    <button type="button" class="btn alt" id="doneBtn">I answered this</button>
                </div>
                <p class="hint" id="count">Answered this session: 0</p>
            </div>
            <div class="card">
                <h2>Timer</h2>
                <div class="timer" id="timer">2:00</div>
                <div class="controls">
                    <button type="button" class="btn" id="startBtn">Start</button>
                    <button type="button" class="btn alt" id="resetBtn">Reset</button>
                </div>
                <h2>Your notes</h2>
                <textarea id="notes" rows="5" placeholder="Jot down the key points of your answer. Saved automatically."></textarea>
            </div>
        </div>
    </main>
    <div id="footer-placeholder"></div>
</div>
</body>
</html>
