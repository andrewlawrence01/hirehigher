<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Higher - Profile</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/x-icon" href="/images/HireHigher.png">
</head>
<body>

    <header>
        <h1>Profile</h1>
    </header>

    <main>
        <form action="#" method="post">

            <li><label for="profile-name">Full Name</label></li>
            <input type="text" id="profile-name" name="name">

            <li><label for="profile-email">Email</label></li>
            <input type="email" id="profile-email" name="email">

            <li><label for="profile-location">Location</label></li>
            <input type="text" id="profile-location" name="location">

            <li><label for="profile-bio">About Me</label></li>
            <textarea id="profile-bio" name="bio" rows="5"></textarea>

            <li><button type="submit">Save Profile</button></li>
        </form>

        <p><a href="/child pages/menu.html">Back to Menu</a></p>
        <p><a href="/index.html">Back to Home</a></p>
    </main>

</body>
</html>
