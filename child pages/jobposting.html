<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Higher - Job Postings</title>
    <script src="../javascript/theme.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="icon" type="image/x-icon" href="../images/HireHigher.png">
    <!-- DO NOT DELETE THIS JAVASCRIPT ITS NEEDED -->
    <script src="../javascript/jobpostings.js" defer></script>
    <script src="../javascript/header.js" defer></script>
    <script src="../javascript/footer.js" defer></script>

</head>

<body>
    <div id="wrapper">
        <div id="header-placeholder"></div>

        <main>
            <section id="search-jobs">
                <h1>Find Remote Jobs</h1>

                <form id="searchForm">
                    <input id="search" type="text" placeholder="Search jobs (e.g. software)" />

                    <button type="submit">Search</button>
                </form>
                <p class="source-note">
                    Job listings are provided by Remotive. Applications take place on the
                    original employer or Remotive website.
                </p>
                <div id="results"></div>
            </section>
        </main>
        <div id="footer-placeholder"></div>
    </div>

</body>

</html>
